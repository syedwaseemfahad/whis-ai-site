<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ogbg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#010c1a"/>
      <stop offset="0.5" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.28" cy="0.35" r="0.6">
      <stop offset="0" stop-color="rgba(14,165,233,0.20)"/>
      <stop offset="1" stop-color="rgba(14,165,233,0)"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.82" cy="0.75" r="0.6">
      <stop offset="0" stop-color="rgba(139,92,246,0.20)"/>
      <stop offset="1" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="132" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.28" stop-color="#22d3ee"/>
      <stop offset="0.58" stop-color="#10b981"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogbg)"/>
  <rect width="1200" height="630" fill="url(#glowSky)"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>

  <!-- Logo mark on navy rounded square -->
  <g transform="translate(140 165)">
    <rect x="1.5" y="1.5" width="129" height="129" rx="34" fill="url(#markBg)" stroke="rgba(14,165,233,0.4)" stroke-width="3"/>
    <g transform="translate(22 26) scale(3.7)">
      <path d="M5 9 L7.5 2 L10 9" fill="rgba(14,165,233,0.22)"/>
      <path d="M14 9 L16.5 2 L19 9" fill="rgba(14,165,233,0.22)"/>
      <path d="M2 5 L6 17 L12 9 L18 17 L22 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="8.5" cy="12" r="1.8" fill="#38bdf8"/>
      <circle cx="15.5" cy="12" r="1.8" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="300" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="112" letter-spacing="-2" fill="#ffffff">Whis<tspan fill="#38bdf8">-AI</tspan></text>

  <!-- Tagline -->
  <text x="145" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="52" letter-spacing="-0.5" fill="#eaf2ff">Your <tspan fill="url(#brandGrad)">Real-Time</tspan> AI Interview Copilot</text>

  <!-- Accent underline -->
  <rect x="147" y="430" width="320" height="6" rx="3" fill="url(#brandGrad)"/>

  <!-- Sub note -->
  <text x="147" y="510" font-family="'Inter', sans-serif" font-weight="500" font-size="30" fill="#93a7cc">Invisible during screen share. Answers as you speak.</text>
</svg>
