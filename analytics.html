<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Product Analytics — Whis-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070b16;--card:#0f1626;--line:rgba(255,255,255,.07);--txt:#e6ecf7;--mut:#8a97ad;--acc:#29b6f6;--acc2:#0ea5e9;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--purple:#a78bfa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',monospace}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-bottom:20px}
  h1{font-size:20px;font-weight:800;margin:0}
  h1 .dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--acc);box-shadow:0 0 12px var(--acc);margin-right:8px;vertical-align:middle}
  .sub{color:var(--mut);font-size:13px;margin-top:3px}
  .btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121b;border:0;border-radius:99px;font-weight:800;padding:9px 16px;cursor:pointer;font-size:13px}
  .btn.ghost{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line)}
  .seg{display:inline-flex;background:#131c2e;border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#04121b}
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tabs button{background:#131c2e;border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:13px;padding:8px 18px;border-radius:10px;cursor:pointer}
  .tabs button.on{background:var(--card);color:var(--txt);border-color:var(--acc)}
  #gate{max-width:380px;margin:16vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}
  #gate input{width:100%;background:#0a1120;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px 14px;font-size:14px;margin:14px 0 12px}
  #gerr{color:var(--bad);font-size:12.5px;min-height:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .kpi .k{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .kpi .v{font-size:24px;font-weight:800;margin-top:7px}
  .kpi .v small{font-size:12px;color:var(--mut);font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .panel h3{margin:0 0 14px;font-size:14px}
  .funnel .step{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .funnel .lbl{width:130px;font-size:13px;color:var(--mut)}
  .funnel .bar{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2));min-width:2px;display:flex;align-items:center;padding:0 10px;color:#04121b;font-weight:800;font-size:12.5px}
  .funnel .rate{font-size:12px;color:var(--good);font-weight:700;margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:#101a2c;color:var(--mut);text-align:right;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td{padding:10px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
  tr.row{cursor:pointer} tr.row:hover td{background:rgba(41,182,246,.05)}
  input.search{background:#0a1120;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:13px;width:280px;max-width:60vw}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:99px}
  .b-paid{background:rgba(52,211,153,.16);color:var(--good)} .b-trial{background:rgba(41,182,246,.16);color:var(--acc)}
  .b-signup{background:rgba(148,163,184,.16);color:var(--mut)} .b-churned{background:rgba(248,113,113,.16);color:var(--bad)}
  .muted{color:var(--mut)}
  .modal{position:fixed;inset:0;background:rgba(3,7,15,.75);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;padding:24px}
  .close{float:right;cursor:pointer;color:var(--mut);font-size:22px;line-height:1}
  .tl{position:relative;margin-top:8px;padding-left:20px;border-left:2px solid var(--line)}
  .ev{position:relative;padding:7px 0 7px 6px}
  .ev::before{content:'';position:absolute;left:-27px;top:12px;width:9px;height:9px;border-radius:99px;background:var(--acc);border:2px solid var(--bg)}
  .ev.k-paid::before{background:var(--good)} .ev.k-signup::before{background:var(--purple)} .ev.k-trial_start::before{background:var(--warn)}
  .ev .t{font-size:13.5px} .ev .ts{font-size:11px;color:var(--mut)}
  .gap{margin:14px 0;color:var(--warn);font-size:12px;font-weight:700;text-align:center}
  .sess{margin:16px 0}
  .sess .sh{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:4px}
  .empty{padding:44px;text-align:center;color:var(--mut)}
</style>
</head>
<body>

<div id="gate">
  <h2 style="margin:0;font-size:18px">Product Analytics</h2>
  <p class="muted" style="font-size:13px;margin:6px 0 0">Enter the dashboard password.</p>
  <input id="pw" type="password" placeholder="Dashboard password" autofocus onkeydown="if(event.key==='Enter')unlock()" />
  <div id="gerr"></div>
  <button class="btn" style="width:100%" onclick="unlock()">Unlock</button>
</div>

<div id="app" class="wrap" style="display:none">
  <header>
    <div><h1><span class="dot"></span>Product Analytics</h1><div class="sub">Every user, every action — from first visit to paid, and the whole group compiled.</div></div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="seg" id="range"><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button></div>
      <button class="btn ghost" onclick="refresh()">↻</button>
    </div>
  </header>
  <div class="tabs"><button id="tabO" class="on" onclick="showTab('overview')">Overview</button><button id="tabU" onclick="showTab('users')">Users</button></div>

  <div id="overview">
    <div class="kpis" id="kpis"></div>
    <div class="panel"><h3>Acquisition funnel</h3><div class="funnel" id="funnel"></div></div>
    <div class="panel"><h3>Daily trend · signups / trials / paid</h3><div id="trend"></div></div>
  </div>

  <div id="users" style="display:none">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <input class="search" id="q" placeholder="Search email or name…" onkeydown="if(event.key==='Enter')loadUsers(0)" />
      <div class="seg" id="stage"><button data-s="" class="on">All</button><button data-s="signup">Signed up</button><button data-s="trial">Trial</button><button data-s="paid">Paid</button></div>
      <span class="muted" id="ucount" style="font-size:12px"></span>
    </div>
    <div class="panel" style="padding:0;overflow:auto;max-height:72vh">
      <table><thead><tr><th>User</th><th>Stage</th><th>Trial s</th><th>Orders</th><th>LTV</th><th>Country</th><th>Source</th><th>Last seen</th></tr></thead>
      <tbody id="ubody"></tbody></table>
      <div class="empty" id="uempty" style="display:none">No users.</div>
    </div>
  </div>
</div>

<div class="modal" id="tl"><div class="sheet"><div id="tlBody"></div></div></div>

<script>
const API="https://api.whis-ai.com";
let PW="",RANGE=30,STAGE="",UPAGE=0;
const $=id=>document.getElementById(id);
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=d=>{ if(!d)return'—'; const s=(Date.now()-new Date(d))/1000; if(s<3600)return Math.round(s/60)+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; };
const dt=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
async function api(p){ const r=await fetch(API+p,{headers:{'x-dashboard-password':PW}}); if(r.status===401)throw new Error('unauth'); return r.json(); }

async function unlock(){
  PW=$('pw').value.trim(); if(!PW){$('gerr').textContent='Enter your password.';return;}
  $('gerr').textContent='Checking…';
  try{ const d=await api('/api/admin/analytics/overview?days=30'); if(d&&d.success){ sessionStorage.setItem('whisPW',PW); $('gate').style.display='none'; $('app').style.display='block'; renderOverview(d); loadUsers(0); } else $('gerr').textContent='Wrong password.'; }
  catch(e){ $('gerr').textContent='Wrong password or server unreachable.'; PW=''; }
}
function showTab(t){ $('overview').style.display=t==='overview'?'block':'none'; $('users').style.display=t==='users'?'block':'none'; $('tabO').classList.toggle('on',t==='overview'); $('tabU').classList.toggle('on',t==='users'); }
async function refresh(){ try{ renderOverview(await api(`/api/admin/analytics/overview?days=${RANGE}`)); loadUsers(0); }catch(e){ if(e.message==='unauth')location.reload(); } }

function kpi(k,v,s){ return `<div class="kpi"><div class="k">${k}</div><div class="v">${v}${s?` <small>${s}</small>`:''}</div></div>`; }
function renderOverview(d){
  const f=d.funnel,a=d.active,r=d.revenue,t=d.trial;
  $('kpis').innerHTML=kpi('Signups',f.signups)+kpi('Trials',f.trials)+kpi('Paid',f.paid)+kpi('DAU',a.dau)+kpi('WAU',a.wau)+kpi('MAU',a.mau)+kpi('Revenue',inr(r.grossINR),`${r.sales} sales`)+kpi('Avg trial use',Math.round(t.avgSeconds)+'s');
  const steps=[['Signed up',f.signups,null],['Started trial',f.trials,f.signupToTrial+'% of signups'],['Engaged (asked Q)',f.engaged,null],['Paid',f.paid,f.trialToPaid+'% of trials']];
  const max=Math.max(1,f.signups);
  $('funnel').innerHTML=steps.map(([l,n,rate])=>`<div class="step"><div class="lbl">${l}</div><div class="bar" style="width:${Math.max(2,n/max*100)}%">${n}</div>${rate?`<span class="rate">${rate}</span>`:''}</div>`).join('');
  const max2=Math.max(1,...d.series.map(s=>Math.max(s.signups,s.trials,s.paid)));
  const bar=(v,c)=>`<div title="${v}" style="flex:1;height:${Math.max(1,v/max2*90)}px;background:${c};border-radius:2px 2px 0 0"></div>`;
  $('trend').innerHTML=`<div style="display:flex;align-items:flex-end;gap:3px;height:100px">${d.series.map(s=>`<div style="flex:1;display:flex;gap:1px;align-items:flex-end">${bar(s.signups,'#8a97ad')}${bar(s.trials,'#29b6f6')}${bar(s.paid,'#34d399')}</div>`).join('')}</div><div class="muted" style="font-size:11px;margin-top:8px">● signups &nbsp; <span style="color:#29b6f6">●</span> trials &nbsp; <span style="color:#34d399">●</span> paid &nbsp;·&nbsp; last ${d.series.length}d</div>`;
}

const B={paid:'b-paid',trial:'b-trial',signup:'b-signup',churned:'b-churned'};
async function loadUsers(p){
  UPAGE=p;
  try{
    const d=await api(`/api/admin/analytics/users?q=${encodeURIComponent($('q').value.trim())}&stage=${STAGE}&page=${p}&limit=100`);
    $('ucount').textContent=`${d.total} users`;
    $('uempty').style.display=d.users.length?'none':'block';
    $('ubody').innerHTML=d.users.map(u=>`<tr class="row" onclick="openTL('${u.googleId}')">
      <td><div style="font-weight:600">${esc(u.email||u.googleId)}</div><div class="muted" style="font-size:11px">${esc(u.name||'')}</div></td>
      <td><span class="badge ${B[u.stage]||'b-signup'}">${u.stage}</span></td>
      <td>${u.trialSeconds||0}</td><td>${u.orders||0}</td><td>${u.ltv?inr(u.ltv):'—'}</td>
      <td>${esc(u.country||'—')}</td><td class="muted">${esc(u.source||'—')}</td><td class="muted">${ago(u.lastSeen)} ago</td></tr>`).join('');
  }catch(e){ if(e.message==='unauth')location.reload(); }
}

const LBL={visit:'Came to the site',signup:'Signed up',login:'Logged in',app_open:'Opened the app',trial_start:'Started a trial',trial_end:'Trial ended',usage:'Used the app',question:'Asked a question',paywall_shown:'Saw the paywall',checkout_start:'Opened checkout',checkout_opened:'Opened checkout',paid:'Paid',refund:'Refund',interview_saved:'Saved their interview',context_saved:'Added context/resume',download_link_sent:'Requested download link',interview_onboard_shown:'Saw onboarding',peak_nudge_shown:'Saw peak nudge',peak_nudge_clicked:'Clicked peak nudge',trial_active:'Trial active',context_quick_upload:'Uploaded resume'};
function evLabel(e){
  let l=LBL[e.type]||e.type;
  if(e.type==='paid') l='Paid '+inr(e.amountINR)+(e.meta&&e.meta.tier?` · ${e.meta.tier} ${e.meta.cycle||''}`:'');
  if(e.type==='usage'&&e.meta&&e.meta.totalSec!=null) l=`Used the app (${e.meta.totalSec}s total)`;
  if(e.type==='question'&&e.meta&&e.meta.tier) l=`Asked a question (${e.meta.tier})`;
  if(e.type==='trial_start'&&e.meta&&e.meta.durationMin) l=`Started a trial (${e.meta.durationMin} min)`;
  return l;
}
async function openTL(gid){
  $('tl').classList.add('show'); $('tlBody').innerHTML='<div class="empty">Loading…</div>';
  try{
    const d=await api(`/api/admin/user/${encodeURIComponent(gid)}/timeline`); if(!d.success)throw 0;
    const u=d.user,s=d.summary;
    const sess=d.sessions.map(se=>{
      const gap=se.gapBeforeDays&&se.gapBeforeDays>=1?`<div class="gap">— came back after ${se.gapBeforeDays} day${se.gapBeforeDays>1?'s':''} —</div>`:'';
      const evs=se.events.map(e=>`<div class="ev k-${e.type}"><div class="t">${esc(evLabel(e))}</div><div class="ts">${dt(e.ts)}</div></div>`).join('');
      return `${gap}<div class="sess"><div class="sh">${(se.surface||'session')} · ${dt(se.start)}</div><div class="tl">${evs}</div></div>`;
    }).join('');
    $('tlBody').innerHTML=`<span class="close" onclick="document.getElementById('tl').classList.remove('show')">×</span>
      <h2 style="margin:0;font-size:18px">${esc(u.email||u.googleId)} <span class="badge ${B[s.stage]||'b-signup'}">${s.stage}</span></h2>
      <div class="muted" style="font-size:12.5px;margin-top:4px">${esc(u.name||'')} · ${esc(u.country||'—')} · source: ${esc(u.source||'organic')}${u.influencerId?` · via ${esc(u.influencerId)}`:''}</div>
      <div class="kpis" style="margin-top:16px">
        ${kpi('First seen',ago(s.firstSeen)+' ago')}${kpi('Days active',s.daysActive)}${kpi('Sessions',s.sessions)}
        ${kpi('Trial seconds',s.trialSecondsUsed)}${kpi('Questions',s.questionsAsked)}${kpi('App opens',s.appOpens)}
        ${kpi('LTV',s.ltvINR?inr(s.ltvINR):'—')}${kpi('Converted',s.converted?(s.timeToConvertHours!=null?`in ${s.timeToConvertHours}h`:'yes'):'no')}
      </div>
      <h3 style="margin:20px 0 6px;font-size:14px">Journey (${s.totalEvents} events)</h3>
      ${sess||'<div class="empty">No events recorded yet.</div>'}`;
  }catch(e){ $('tlBody').innerHTML='<span class="close" onclick="document.getElementById(\'tl\').classList.remove(\'show\')">×</span><div class="empty">Could not load.</div>'; }
}

document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#range button').forEach(x=>x.classList.remove('on'));b.classList.add('on');RANGE=parseInt(b.dataset.d);refresh();});
document.querySelectorAll('#stage button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#stage button').forEach(x=>x.classList.remove('on'));b.classList.add('on');STAGE=b.dataset.s;loadUsers(0);});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('show');}));
(function(){ const p=sessionStorage.getItem('whisPW'); if(p){PW=p;$('pw').value=p;unlock();} })();
</script>
</body>
</html>
